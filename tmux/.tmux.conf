# tmux -V 3.7c

# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# General
set -g mouse on
set -g history-limit 10000
set -g renumber-windows on
set -g base-index 1
set -g escape-time 0
set -sg escape-time 10
set -g focus-events on
set -g detach-on-destroy off
setw -g aggressive-resize on
setw -g pane-base-index 1


# fixed: precent jump while selecting
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config: Ctrl-Space + r
unbind r
bind r source-file ~/.tmux.conf \; # display-message "Chunchunmaru"

# Navigate panes with Alt + Vim keys 
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize with ctrl + alt + swift = arrow
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Pane Controls
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
# bind -n M-Escape kill-pane

# Session controls Ctrl + k / Alt + j 
# bind -n C-k switch-client -p
# bind -n C-j switch-client -n

# Resize panes with prefix + H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

# Start window numbering at 1
set -g pane-border-status off

# Status bar
set -g status on
set -g status-position bottom 
set -g status-justify centre
set -g status-interval 5
set -g status-left-length 30
set -g status-right ''
set -g status-interval 5

# Tokyo Night window highlighting
set -g status-left '#[fg=#f9f9f9,bg=#0e1012,bold] [#S] #[fg=#f9f9f9,bg=#0e1012,nobold]'
set -g status-style 'bg=#0e1012,fg=#f9f9f9'
set -g window-status-format '#[fg=#f9f9f9,bg=#0e1012] #I:#W '
set -g window-status-current-format '#[fg=#02066F,bg=#f9f9f9,bold] #I:#W '
set -g pane-border-style 'fg=#292e42'
set -g pane-active-border-style 'fg=#0D51AE'
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Support terminal colors inside tmux
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# Don't ask for confirmation when killing a pane
bind x kill-pane

# Enter jumps to the bottom in copy mode
bind -T copy-mode-vi Enter send -X cancel
bind -T copy-mode Enter send -X cancel

